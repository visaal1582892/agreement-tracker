spring.application.name=agreement-tracker-backend

# ── DataSource ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agreement_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=MedPlusAgreementTrackerSecretKey2026MustBeAtLeast256BitsForHS256Algorithm
jwt.expiration-ms=86400000

# ── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── App ───────────────────────────────────────────────────────────────────────
app.agreement-number-prefix=AGR
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Logging (console — see logback-spring.xml) ───────────────────────────────
logging.level.root=INFO
logging.level.com.medplus.agreement_tracker_backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
